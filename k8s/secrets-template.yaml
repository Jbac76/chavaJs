# Kubernetes Secrets Template
#
# IMPORTANT: Do NOT commit actual secrets to version control!
# This is a template showing the structure. Create actual secrets using:
#
# kubectl create secret generic chavajs-secrets \
#   --from-literal=app-key='your-app-key-here' \
#   --from-literal=db-username='your-db-user' \
#   --from-literal=db-password='your-db-password' \
#   --from-literal=redis-password='your-redis-password'
#
# Or use a secrets management system like:
# - HashiCorp Vault
# - AWS Secrets Manager
# - Azure Key Vault
# - Google Secret Manager
# - Sealed Secrets

apiVersion: v1
kind: Secret
metadata:
  name: chavajs-secrets
type: Opaque
data:
  # All values must be base64 encoded
  # Example: echo -n "your-secret-value" | base64

  app-key: <BASE64_ENCODED_APP_KEY>
  db-username: <BASE64_ENCODED_DB_USERNAME>
  db-password: <BASE64_ENCODED_DB_PASSWORD>
  redis-password: <BASE64_ENCODED_REDIS_PASSWORD>
